<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Slide Previews</title>
    <style>
      :root {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
        color-scheme: light;
        --bg: #f8fafc;
        --paper: #ffffff;
        --ink: #111827;
        --muted: #667085;
        --line: #d0d5dd;
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--ink); }
      main { width: min(980px, calc(100vw - 40px)); margin: 0 auto; padding: 40px 0; }
      .back { color: var(--muted); font-size: 14px; font-weight: 700; text-decoration: none; }
      h1 { margin: 18px 0 10px; font-size: clamp(32px, 6vw, 56px); letter-spacing: 0; }
      p { max-width: 720px; margin: 0 0 28px; color: var(--muted); line-height: 1.7; }
      .list { display: grid; gap: 14px; }
      .item {
        display: block;
        padding: 20px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--paper);
        color: inherit;
        text-decoration: none;
      }
      .item strong { display: block; margin-bottom: 8px; font-size: 22px; }
      .item span { color: var(--muted); line-height: 1.6; }
    </style>
  </head>
  <body>
    <main>
      <a class="back" href="../">← Home</a>
      <h1>Slide Previews</h1>
      <p>Static slide previews and review pages.</p>
      <section class="list" aria-label="スライドプレビュー">
        <a class="item" href="./honshitsu-ai-course/">
          <strong>Honshitsu AI Course</strong>
          <span>Day 1 / Day 2 screenshots and slide-format references.</span>
        </a>
      </section>
    </main>
  </body>
</html>
