<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" role="img" aria-labelledby="title desc">
  <title id="title">Two layer plan structure</title>
  <desc id="desc">A two layer plan structure with Log Lite as the one-ID price anchor and kintone Pack as the core connected plan for two or more IDs.</desc>
  <rect width="760" height="520" rx="12" fill="#f2f5f6"/>
  <rect x="48" y="50" width="664" height="420" rx="8" fill="#fbfcfc" stroke="#cfd6d9" stroke-width="2"/>
  <text x="80" y="94" fill="#6d7375" font-family="system-ui, sans-serif" font-size="18" font-weight="800">PRICE ANCHOR / CORE PACK</text>

  <g transform="translate(86 142)">
    <rect width="258" height="220" rx="8" fill="#fff" stroke="#cfd6d9" stroke-width="2"/>
    <circle cx="52" cy="56" r="24" fill="#fff1ec" stroke="#ff7143" stroke-width="2"/>
    <text x="43" y="65" fill="#ff7143" font-family="system-ui, sans-serif" font-size="26" font-weight="900">1</text>
    <text x="28" y="112" fill="#414242" font-family="system-ui, sans-serif" font-size="26" font-weight="850">Log Lite</text>
    <text x="28" y="148" fill="#6d7375" font-family="system-ui, sans-serif" font-size="18" font-weight="700">1ID限定 / 1,980円</text>
    <text x="28" y="178" fill="#6d7375" font-family="system-ui, sans-serif" font-size="16">追加ID不可</text>
  </g>

  <g transform="translate(416 142)">
    <rect width="258" height="220" rx="8" fill="#fff8f5" stroke="#ff7143" stroke-width="3"/>
    <circle cx="52" cy="56" r="24" fill="#ff7143"/>
    <text x="43" y="65" fill="#fff" font-family="system-ui, sans-serif" font-size="26" font-weight="900">2</text>
    <text x="28" y="112" fill="#414242" font-family="system-ui, sans-serif" font-size="26" font-weight="850">kintone Pack</text>
    <text x="28" y="148" fill="#6d7375" font-family="system-ui, sans-serif" font-size="18" font-weight="700">初年度限定 2,980円 / ID</text>
    <text x="28" y="178" fill="#6d7375" font-family="system-ui, sans-serif" font-size="16">2ID以上・連携はこちら</text>
  </g>

  <path d="M350 252h58" stroke="#ff7143" stroke-width="5" stroke-linecap="round"/>
  <path d="m397 239 18 13-18 13" fill="none" stroke="#ff7143" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="118" y="394" width="524" height="34" rx="17" fill="#e5eaec"/>
  <rect x="118" y="394" width="172" height="34" rx="17" fill="#ff7143"/>
  <text x="304" y="417" fill="#6d7375" font-family="system-ui, sans-serif" font-size="16" font-weight="800">1ID限定と本命Packを分ける</text>
</svg>
