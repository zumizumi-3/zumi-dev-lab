<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" role="img" aria-labelledby="title desc">
  <title id="title">ID price ladder</title>
  <desc id="desc">A price ladder showing one, two, five, and ten IDs with first-year monthly totals.</desc>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;800;900&amp;display=swap");
    text { font-family: "Noto Sans JP", "Noto Sans", sans-serif; }
  </style>
  <rect width="760" height="520" rx="12" fill="#f2f5f6"/>
  <rect x="48" y="48" width="664" height="424" rx="8" fill="#fbfcfc" stroke="#cfd6d9" stroke-width="2"/>
  <text x="82" y="96" fill="#414242" font-family="Noto Sans JP, Noto Sans, sans-serif" font-size="30" font-weight="850">ID Pricing Ladder</text>
  <text x="82" y="128" fill="#6d7375" font-family="Noto Sans JP, Noto Sans, sans-serif" font-size="17" font-weight="700">初年度限定: 3,980円 / ID / 月（税抜）</text>
  <line x1="112" y1="402" x2="648" y2="402" stroke="#cfd6d9" stroke-width="2"/>
  <g fill="#ff7143">
    <rect x="122" y="342" width="84" height="60" rx="6"/>
    <rect x="254" y="312" width="84" height="90" rx="6"/>
    <rect x="386" y="238" width="84" height="164" rx="6"/>
    <rect x="518" y="154" width="84" height="248" rx="6"/>
  </g>
  <g fill="#414242" font-family="Noto Sans JP, Noto Sans, sans-serif" text-anchor="middle" font-weight="850">
    <text x="164" y="328" font-size="22">1ID</text>
    <text x="296" y="298" font-size="22">2ID</text>
    <text x="428" y="224" font-size="22">5ID</text>
    <text x="560" y="140" font-size="22">10ID</text>
  </g>
  <g fill="#fff" font-family="Noto Sans JP, Noto Sans, sans-serif" text-anchor="middle" font-weight="900">
    <text x="164" y="378" font-size="18">3,980</text>
    <text x="296" y="362" font-size="18">7,960</text>
    <text x="428" y="316" font-size="18">19,900</text>
    <text x="560" y="282" font-size="18">39,800</text>
  </g>
  <text x="82" y="446" fill="#6d7375" font-family="Noto Sans JP, Noto Sans, sans-serif" font-size="16">初年度のみ3,980円/ID（税抜）。2年目以降は通常単価</text>
</svg>
