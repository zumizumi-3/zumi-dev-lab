<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Purpose Formats</title>
    <style>
      :root {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
        color-scheme: light;
        --bg: #f8fafc;
        --paper: #ffffff;
        --ink: #111827;
        --muted: #667085;
        --line: #d0d5dd;
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--ink); }
      main { width: min(980px, calc(100vw - 40px)); margin: 0 auto; padding: 40px 0; }
      .back { color: var(--muted); font-size: 14px; font-weight: 700; text-decoration: none; }
      h1 { margin: 18px 0 10px; font-size: clamp(32px, 6vw, 56px); letter-spacing: 0; }
      p { max-width: 720px; margin: 0; color: var(--muted); line-height: 1.7; }
      .empty {
        margin-top: 28px;
        padding: 22px;
        border: 1px dashed var(--line);
        border-radius: 8px;
        background: var(--paper);
      }
    </style>
  </head>
  <body>
    <main>
      <a class="back" href="../">← Format Library</a>
      <h1>Purpose Formats</h1>
      <p>企業別、案件別、用途別に派生したフォーマットパックをここに増やします。各フォーマットは、参照元、親ベース、フォント、カラー、ロゴ配置、背景、間仕切り、パターン差分を持つ想定です。</p>
      <div class="empty">まだ目的別フォーマットは登録していません。</div>
    </main>
  </body>
</html>
