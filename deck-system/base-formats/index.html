<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Base Formats</title>
    <style>
      :root {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
        color-scheme: light;
        --bg: #f8fafc;
        --paper: #ffffff;
        --ink: #111827;
        --muted: #667085;
        --line: #d0d5dd;
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--ink); }
      main { width: min(980px, calc(100vw - 40px)); margin: 0 auto; padding: 40px 0; }
      a { color: inherit; }
      .back { color: var(--muted); font-size: 14px; font-weight: 700; text-decoration: none; }
      h1 { margin: 18px 0 10px; font-size: clamp(32px, 6vw, 56px); letter-spacing: 0; }
      .lead { max-width: 720px; margin: 0 0 28px; color: var(--muted); line-height: 1.7; }
      .list { display: grid; gap: 14px; }
      .item {
        display: block;
        padding: 20px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--paper);
        text-decoration: none;
      }
      .item strong { display: block; margin-bottom: 8px; font-size: 22px; }
      .item span { color: var(--muted); line-height: 1.6; }
    </style>
  </head>
  <body>
    <main>
      <a class="back" href="../">← Format Library</a>
      <h1>Base Formats</h1>
      <p class="lead">ブランドや案件情報を入れる前の土台です。ここでは背景装飾、ロゴ、強いカラーを使わず、目的別フォーマットへ派生しやすい構造だけを管理します。</p>
      <section class="list" aria-label="ベースフォーマット">
        <a class="item" href="./plain-neutral/">
          <strong>Plain Neutral</strong>
          <span>白背景、グレー罫線、標準的な見出し・本文・比較・手順・表・まとめの型。</span>
        </a>
        <a class="item" href="./plain-business-ppt/">
          <strong>Plain Business PPT</strong>
          <span>既存の業務PPT群から抽出した、表紙・間仕切り・図解・表・比較・image2本文版を含む50構図の密度高めプレーン型。</span>
        </a>
      </section>
    </main>
  </body>
</html>
