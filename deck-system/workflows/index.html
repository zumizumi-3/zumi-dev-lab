<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Deck Workflows</title>
    <style>
      :root {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
        color-scheme: light;
        --bg: #f8fafc;
        --paper: #ffffff;
        --ink: #111827;
        --muted: #667085;
        --line: #d0d5dd;
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--ink); }
      main { width: min(980px, calc(100vw - 40px)); margin: 0 auto; padding: 40px 0; }
      a { color: inherit; }
      .back { color: var(--muted); font-size: 14px; font-weight: 700; text-decoration: none; }
      h1 { margin: 18px 0 10px; font-size: clamp(32px, 6vw, 56px); letter-spacing: 0; }
      .lead { max-width: 760px; margin: 0 0 28px; color: var(--muted); line-height: 1.7; }
      .list { display: grid; gap: 14px; }
      .item {
        display: block;
        padding: 20px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--paper);
        text-decoration: none;
      }
      .item strong { display: block; margin-bottom: 8px; font-size: 22px; }
      .item span { color: var(--muted); line-height: 1.6; }
    </style>
  </head>
  <body>
    <main>
      <a class="back" href="../">← Format Library</a>
      <h1>Deck Workflows</h1>
      <p class="lead">ベースフォーマット、企業フォーマット、台本入力、スライド生成をつなぐための標準工程を管理します。</p>
      <section class="list" aria-label="スライド生成工程">
        <a class="item" href="./plain-to-company-deck/">
          <strong>Plain to Company Deck</strong>
          <span>Plain Neutral、Plain Business PPT、Plain Business Visual PPTを親にして企業フォーマットを作成し、台本入力から資料化する標準フロー。</span>
        </a>
      </section>
    </main>
  </body>
</html>
