<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>本質のAI講座 公開資料</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
        --ink: #0f172a;
        --muted: #526174;
        --line: #d7e2eb;
        --paper: #fffdf7;
        --teal: #0f8b7f;
        --blue: #2563eb;
        --amber: #d97706;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        background:
          radial-gradient(circle at 88% 10%, rgba(37, 99, 235, 0.14), transparent 28%),
          linear-gradient(135deg, rgba(15, 139, 127, 0.12), transparent 44%),
          #eef4f7;
        color: var(--ink);
      }
      main {
        width: min(1120px, calc(100vw - 40px));
        margin: 0 auto;
        padding: 56px 0;
      }
      .eyebrow {
        margin: 0 0 14px;
        color: var(--teal);
        font-size: 14px;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      h1 {
        margin: 0;
        max-width: 780px;
        font-size: clamp(40px, 6vw, 78px);
        line-height: 1.08;
        letter-spacing: 0;
      }
      .lead {
        max-width: 760px;
        margin: 24px 0 0;
        color: var(--muted);
        font-size: clamp(18px, 2.2vw, 24px);
        font-weight: 700;
        line-height: 1.7;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 18px;
        margin-top: 44px;
      }
      .card {
        display: grid;
        min-height: 180px;
        padding: 28px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: rgba(255, 253, 247, 0.94);
        color: inherit;
        text-decoration: none;
        box-shadow: 0 18px 48px rgba(15, 23, 42, 0.10);
      }
      .card strong {
        display: block;
        margin-bottom: 12px;
        font-size: 28px;
        line-height: 1.2;
      }
      .card span {
        color: var(--muted);
        font-size: 16px;
        font-weight: 700;
        line-height: 1.55;
      }
      .card.primary { border-top: 8px solid var(--teal); }
      .card.secondary { border-top: 8px solid var(--blue); }
      .card.work { border-top: 8px solid var(--amber); }
      .links {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 28px;
      }
      .pill {
        display: inline-flex;
        min-height: 44px;
        align-items: center;
        padding: 10px 16px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: #fff;
        color: var(--ink);
        font-weight: 800;
        text-decoration: none;
      }
      @media (max-width: 760px) {
        main { padding: 36px 0; }
        .grid { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Honshitsu AI Course</p>
      <h1>本質のAI講座 公開資料</h1>
      <p class="lead">講義スライドは1枚ずつ送れるプレゼン表示です。ワークページは入力内容をブラウザ内に保存し、講座後にレポート化できます。</p>
      <section class="grid" aria-label="主要リンク">
        <a class="card primary" href="./presentation/day-1/">
          <strong>Day 1 スライド</strong>
          <span>72枚 / AIに任せる前に、自分の課題を整える</span>
        </a>
        <a class="card secondary" href="./presentation/day-2/">
          <strong>Day 2 スライド</strong>
          <span>42枚 / 自分の業務に戻せるAI活用フローを試作する</span>
        </a>
        <a class="card work" href="/work/">
          <strong>ワークページ</strong>
          <span>Day 1 / Day 2 の入力、保存、レポート化</span>
        </a>
        <a class="card work" href="/work/day2/w-d2-08">
          <strong>アンケート用メモ</strong>
          <span>Day 2最後の振り返り項目。実施後アンケートの下書きとして使います。</span>
        </a>
      </section>
      <nav class="links" aria-label="補助リンク">
        <a class="pill" href="/work/day1">Day 1 ワーク</a>
        <a class="pill" href="/work/day2">Day 2 ワーク</a>
        <a class="pill" href="/work/report">レポート</a>
        <a class="pill" href="/work/instructor">講師確認</a>
        <a class="pill" href="../slide-previews/honshitsu-ai-course/">スクリーンショット一覧</a>
      </nav>
    </main>
  </body>
</html>
